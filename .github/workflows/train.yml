# =======================================================================
# Rahul's AI Lab · Fraud Detection · Production-grade ML pipelines on AWS
# =======================================================================

name: train
# Hyperparameters live in config/experiments/*.yaml and config/production/model.yaml,
# never here. This workflow only passes which config and which immutable data run to use.
# kind: experiment = the experiment file decides the run (all-scalar params = one training job;
# lists/ranges with tuning.strategy = an AMT search); production = retrain the approved config.
# A search is followed by select_winner; every run is then evaluated on test and gated.
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: "config/experiments/*.yaml (e.g. experiment-002-manual-params.yaml for one run, experiment-004-depth-sensitivity.yaml for a grid)"
        required: true
      data_run_id:
        description: "immutable processed/<run_id> (never 'latest')"
        required: true
      kind:
        type: choice
        options: [experiment, production]
        default: experiment
  # DISABLED until an approved config/production/model.yaml and the PRODUCTION_DATA_RUN_ID
  # repository variable exist. See DOCS/model-training/train-workflow-explained.md (3.2).
  # schedule:
  #   - cron: "0 3 * * 1" # weekly retrain of the approved config, production kind only

permissions:
  id-token: write
  contents: read

env:
  KIND: ${{ inputs.kind || 'production' }}
  EXPERIMENT: ${{ inputs.experiment || 'config/experiments/experiment-001.yaml' }}
  DATA_RUN_ID: ${{ inputs.data_run_id || vars.PRODUCTION_DATA_RUN_ID }}

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --locked
      - name: Load MLflow credentials
        run: |
          secret=$(aws secretsmanager get-secret-value --secret-id fraud-detection/dev/dagshub-mlflow --query SecretString --output text)
          echo "::add-mask::$(echo "$secret" | jq -r .MLFLOW_TRACKING_PASSWORD)"
          echo "MLFLOW_TRACKING_USERNAME=$(echo "$secret" | jq -r .MLFLOW_TRACKING_USERNAME)" >> "$GITHUB_ENV"
          echo "MLFLOW_TRACKING_PASSWORD=$(echo "$secret" | jq -r .MLFLOW_TRACKING_PASSWORD)" >> "$GITHUB_ENV"
      - name: Train
        run: |
          uv run python -m src.training.run_training_job --mode sagemaker \
            --kind "$KIND" --experiment "$EXPERIMENT" --data-run-id "$DATA_RUN_ID" \
            --output-json run.json
      - name: Select winner (searches only)
        run: |
          if ! jq -e .parent_run_id run.json > /dev/null; then
            echo "single run, no winner selection needed"
            exit 0
          fi
          uv run python -m src.evaluation.select_winner \
            --parent-run-id "$(jq -r .parent_run_id run.json)" --output-json run.json >> "$GITHUB_STEP_SUMMARY"
      - name: Evaluate on test, gate and register
        run: uv run python -m src.evaluation.evaluate --run-id "$(jq -r .run_id run.json)"
