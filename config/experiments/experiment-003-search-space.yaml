# Experiment 003 (AMT): search ranges informed by experiment-002-manual-params,
# run with `--kind hpo`. Center each range on the region the manual runs showed to be good,
# with margin on both sides, and drop parameters the manual runs showed to be flat.
# Keep static_params, runtime and data identical to the manual file so metrics stay comparable.
# Environment values (buckets, ARNs) live in config/env/.
experiment:
  name: exp-003-search-space
  mode: hpo
data:
  run_id: synthetic-v0    # immutable, explicit folder under processed/ (never "latest")
runtime:
  xgboost_version: "1.7.4"          # must equal the container's XGBoost; train.py fails on mismatch
  sagemaker_framework_version: "1.7-1"
static_params:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  eta: 0.1
  num_round: 200
  early_stopping_rounds: 20
  seed: 42
  min_precision: 0.9       # precision floor used to pick the decision threshold on validation
# Tunable parameters; keys here must not repeat static_params. Use scaling: Logarithmic for
# strictly positive parameters spanning orders of magnitude (eta, lambda, alpha).
search_space:
  max_depth:        {type: integer,    min: 5, max: 11}
  min_child_weight: {type: continuous, min: 1, max: 8}
  gamma:            {type: continuous, min: 0, max: 3}
tuning:
  objective_metric: validation:aucpr
  objective_type: Maximize
  strategy: Bayesian
  max_jobs: 3              # raise to ~10-20 trials per tuned parameter for a real search
  max_parallel_jobs: 2
