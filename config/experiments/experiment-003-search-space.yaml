# Rahul's AI Lab · Fraud Detection · Production-grade ML pipelines on AWS
# =======================================================================

# Experiment 003 (Bayesian search over ranges). Keep the scalar params, runtime and data
# identical to the baseline (experiment-002-manual-params) so metrics stay comparable.
# Prefer wide ranges around sensible defaults over ranges narrowed from a single point.
# Use scaling: Logarithmic for strictly positive params spanning orders of magnitude
# (eta, lambda, alpha). Environment values (buckets, ARNs) live in config/env/.
experiment:
  name: exp-003-search-space
data:
  run_id: f31148e-744cfb52d4c1-data-v0    # immutable preprocessing run: <git_sha>-<config_hash>-<data_version> (never "latest")
runtime:
  xgboost_version: "1.7.4"          # must equal the container's XGBoost; train.py fails on mismatch
  sagemaker_framework_version: "1.7-1"
params:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  eta: 0.1
  num_round: 200
  early_stopping_rounds: 20
  seed: 42
  min_precision: 0.9       # precision floor used to pick the decision threshold on validation
  max_depth:        {type: integer,    min: 5, max: 11}
  min_child_weight: {type: continuous, min: 1, max: 8}
  gamma:            {type: continuous, min: 0, max: 3}
tuning:
  strategy: bayesian
  objective_metric: validation:aucpr
  objective_type: Maximize
  max_jobs: 3              # raise to ~10-20 trials per tuned parameter for a real search
  max_parallel_jobs: 2
