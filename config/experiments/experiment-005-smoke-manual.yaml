# Experiment 005 (smoke, single run): the cheap plumbing counterpart of experiment-002-manual-params.
# Same point, but num_round/early_stopping_rounds cut to the CLAUDE.md smoke budget. Metrics are
# not comparable with 002 and the values must never be copied into config/production/model.yaml.
# Environment values (buckets, ARNs) live in config/env/.
experiment:
  name: exp-005-smoke-manual
data:
  run_id: synthetic-v0    # immutable, explicit folder under processed/ (never "latest")
runtime:
  xgboost_version: "1.7.4"          # must equal the container's XGBoost; train.py fails on mismatch
  sagemaker_framework_version: "1.7-1"
params:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  eta: 0.1
  num_round: 20
  early_stopping_rounds: 5
  seed: 42
  min_precision: 0.9       # precision floor used to pick the decision threshold on validation
  max_depth: 8
  min_child_weight: 3
  gamma: 1
