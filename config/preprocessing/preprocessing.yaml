# =======================================================================
# Rahul's AI Lab · Fraud Detection · Production-grade ML pipelines on AWS
# =======================================================================

# Preprocessing / feature-engineering settings shared by the prototype notebook
# and (later) the PySpark processor. Environment values (buckets, ARNs) live in
# config/env/, not here.
data:
  input_path: "dataset/raw/data-v0"
  output_dir: "dataset/processed/data-v0"
  label_col: "isFraud"
  keep_types: ["TRANSFER", "CASH_OUT"]

features:
  # Leaky post-transaction balance "error" features; PaySim artifact, keep off by default.
  include_balance_error_features: false
  night_hours: [0, 6]        # inclusive hour_of_day range flagged as night

split:
  # Time-based split on `step`: thresholds are fractions of the max step.
  train_frac_of_max_step: 0.70
  val_frac_of_max_step: 0.85

seed: 42

# Settings for the SageMaker PySpark Processing job (job sizing only, no model hyperparameters).
processing:
  base_job_name: "fraud-preprocess"
  spark_framework_version: "3.5"
  sdk_staging_prefix: "processed/_sdk"   # where the SDK stages its script upload (role must read it)
  instance_type: "ml.m5.xlarge"
  instance_count: 1
  volume_size_gb: 20                 # dev; raise for the full 15GB+ dataset (shuffle spill)
  max_runtime_s: 3600                # cost guard
  target_file_mb: 128                # desired parquet file size per split
  spark_conf:
    spark.sql.shuffle.partitions: "8"   # raise for the full dataset
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.skewJoin.enabled: "true"
