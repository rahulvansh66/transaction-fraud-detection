[project]
name = "transaction-fraud-detection"
version = "0.1.0"
description = "Scalable, production-grade fraud detection ML pipeline on AWS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "mlflow>=2.14",
    "pandas>=2.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sagemaker-core>=2.23.0",
    "sagemaker-mlops>=1.23.0",
    "scikit-learn>=1.9.1",
    "xgboost==1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "pyspark>=3.5,<3.6",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: end-to-end tests that run the full Spark job on local data"]
